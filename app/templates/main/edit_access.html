{% extends "base.html" %}
{% block title %}Editar registro{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card"><div class="card-header bg-dark text-white"><strong>Editar registro #{{ log.id }}</strong></div><div class="card-body"><form method="POST" class="row g-3"><div class="col-md-6"><label class="form-label">Entrada</label><input class="form-control" type="datetime-local" name="entry_time" value="{{ log.entry_time.strftime('%Y-%m-%dT%H:%M') }}" required></div><div class="col-md-6"><label class="form-label">Saída</label><input class="form-control" type="datetime-local" name="exit_time" value="{{ log.exit_time.strftime('%Y-%m-%dT%H:%M') if log.exit_time else '' }}"></div><div class="col-md-6"><label class="form-label">Matrícula</label><input class="form-control text-uppercase" name="vehicle_plate" value="{{ log.vehicle_plate }}" required></div><div class="col-md-6"><label class="form-label">Tipo interno</label><input class="form-control" value="{{ log.vehicle_type }}" disabled><input type="hidden" name="vehicle_type" value="{{ log.vehicle_type }}"></div><div class="col-md-6"><label class="form-label">Produto</label><input class="form-control" name="product" value="{{ log.product or log.company }}" required></div><div class="col-md-6"><label class="form-label">Destino</label><input class="form-control" name="destination" value="{{ log.destination }}" required></div><div class="col-md-6"><label class="form-label">Nome do condutor</label><input class="form-control" name="driver_name" value="{{ log.driver_name }}" required></div><div class="col-md-6"><label class="form-label">Movimentação</label><div class="pt-2"><div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="movement" value="Carregar" id="movement_load" {{ 'checked' if 'Carregar' in (log.movement or '') }}><label class="form-check-label" for="movement_load">Carregar</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="movement" value="Descarregar" id="movement_unload" {{ 'checked' if 'Descarregar' in (log.movement or '') }}><label class="form-check-label" for="movement_unload">Descarregar</label></div></div></div><div class="col-12"><label class="form-label">Observações adicionais</label><textarea class="form-control" name="observations" rows="3">{{ log.observations or '' }}</textarea></div><div class="col-12 d-flex gap-2"><a class="btn btn-secondary flex-fill" href="{{ url_for('main.dashboard') }}">Cancelar</a><button class="btn btn-primary flex-fill">Salvar</button></div></form></div></div></div></div>{% endblock %}
