{% extends "base.html" %}
{% block title %}Editar registro{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card"><div class="card-header bg-dark text-white"><strong>Editar registro #{{ log.id }}</strong></div><div class="card-body"><form method="POST" class="row g-3"><div class="col-md-6"><label class="form-label">Entrada</label><input class="form-control" type="datetime-local" name="entry_time" value="{{ log.entry_time.strftime('%Y-%m-%dT%H:%M') }}" required></div><div class="col-md-6"><label class="form-label">Saída</label><input class="form-control" type="datetime-local" name="exit_time" value="{{ log.exit_time.strftime('%Y-%m-%dT%H:%M') if log.exit_time else '' }}"></div><div class="col-md-6"><label class="form-label">Matrícula</label><input class="form-control text-uppercase" name="vehicle_plate" value="{{ log.vehicle_plate }}" required></div><div class="col-md-6"><label class="form-label">Reboque</label><input class="form-control text-uppercase" name="trailer_plate" value="{{ log.trailer_plate or '' }}"></div><div class="col-md-6"><label class="form-label">Tipo</label><select class="form-select" name="vehicle_type"><option value="ligeiro" {{ 'selected' if log.vehicle_type == 'ligeiro' }}>Ligeiro</option><option value="pesado" {{ 'selected' if log.vehicle_type == 'pesado' }}>Pesado</option><option value="moto" {{ 'selected' if log.vehicle_type == 'moto' }}>Moto</option><option value="pedestre" {{ 'selected' if log.vehicle_type == 'pedestre' }}>Pedestre</option></select></div><div class="col-md-6"><label class="form-label">Empresa</label><input class="form-control" name="company" value="{{ log.company }}" required></div><div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" name="driver_name" value="{{ log.driver_name }}" required></div><div class="col-md-6"><label class="form-label">Documento</label><input class="form-control" name="driver_doc" value="{{ log.driver_doc }}" required></div><div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" name="observations" rows="3">{{ log.observations or '' }}</textarea></div><div class="col-12 d-flex gap-2"><a class="btn btn-secondary flex-fill" href="{{ url_for('main.dashboard') }}">Cancelar</a><button class="btn btn-primary flex-fill">Salvar</button></div></form></div></div></div></div>{% endblock %}
